# board.toml: the facts the circuit, the firmware and the spec must agree on (D-022, D-023).
# Copy to boards/<name>/board.toml. Checked by the BOARD.TOML gate (sch, check and fw stages);
# the fw stage turns it into firmware/board_pins.h. Unknown keys are errors.

[board]
name = "<name>"        # must equal the circuit's name (Circuit::new)
revision = "0"         # must equal the circuit's revision
module = "U1"          # reference of the ESP32-S3-WROOM-1 module

# One [[pin]] per module pin the circuit uses as a GPIO; the gate fails if the circuit
# uses one that is not listed here.
#   signal: firmware name, upper case (the header defines PIN_<signal>)
#   pin:    the module symbol's pin name: IO0..IO48, TXD0 (GPIO 43), RXD0 (GPIO 44),
#           USB_D- (GPIO 19), USB_D+ (GPIO 20)
#   net:    the circuit net on that pin, as named in circuit.rs
#   dir:    "in", "out" or "io"
[[pin]]
signal = "STATUS_LED"
pin = "IO48"
net = "STATUS"
gpio = 48
dir = "out"
active_low = false     # optional; true adds PIN_<signal>_ACTIVE_LOW to the header
sim = "led"            # optional: the Wokwi part on this pin (button, led, led_r, led_g, led_b, pot)
note = ""              # optional; copied into the header comment

[power]
source = "USB-C 5 V"
budget_ma = 500        # what the source may give; the loads must fit under it

# Worst-case current of each load, at the input. Say where each number comes from;
# write INFERRED in `source` if it is a guess.
[[power.load]]
name = "ESP32-S3 module, Wi-Fi transmit peak"
ma = 355
source = "WROOM-1 datasheet, HARDWARE_LESSONS.md"

# One per requirement in spec.md, same IDs. covered_by lists what shows it is met:
#   part:<ref>   a part in the circuit
#   pin:<signal> a signal in the pin map above
#   test:<name>  a firmware self-test below
#   gate:<name>  erc, drc, netlist, netclasses, routing or board_toml
[[requirement]]
id = "R1"
text = "Shows that it is running with a status light"
covered_by = ["part:D2", "pin:STATUS_LED", "test:status_led"]

[firmware]
# Self-tests the firmware runs at bring-up and reports over USB; each must cover a requirement.
self_test = ["status_led"]

# Wokwi pin checks (`sim --wokwi`; optional). Each step waits for a console line, then presses
# a button signal (hold_ms, default 200; 1000+ is a hold) or checks a signal is at `level`.
# The run then waits for SELFTEST_DONE. Print a report only after a button is released.
[[sim.wokwi_step]]
wait = "SELFTEST_LOOK status_led on"
expect = "STATUS_LED"
level = 1

# Values `devctl provision` writes into the board's NVS (optional). Only references go here,
# never values: "file:<path>#<field>" (a key=value line in that file) or "prompt".
# Keys: [a-z0-9_], at most 15 characters.
# [provision]
# wifi_ssid = "prompt"
# gemini_api_key = "file:~/.config/capture-notes/config#gemini_api_key"

# The printed case (optional; the `case` stage, D-025 Phase B). Two parts: a tray under the board
# and a lid, closed by self-tapping screws from below through the board's mounting holes.
# Minimums come from the material (JLC3DP): resin walls >= 1.2, holes >= 1.0; nylon 1.5 and 1.5.
# [case]
# material = "resin"      # resin (JLC3DP 9600 white) | nylon (MJF PA12)
# wall = 1.5              # side wall, mm
# floor = 1.5             # tray floor and lid plate
# edge_gap = 0.3          # PCB edge to the inner wall
# top_gap = 1.0           # tallest part to the lid's underside
# bottom_gap = 3.0        # PCB underside to the floor (standoff height)
# min_clearance = 0.2     # fit gate: case to every part
# screw = "M2"            # M2 | M2.5 | M3; the gate picks a length that engages 2 x d in the lid
#
# One per part the case must let through. kind: usb_c | connector | button | pinhole | led | vent.
# Optional: usb_c/connector margin (0.3) and height (usb_c 3.26; a connector must give its
# datasheet height); button diameter (cap, 4.0) and travel (0.25); pinhole diameter (1.4);
# led style ("window" | "hole") and diameter; vent slots (3), slot_width (1.2), slot_length (5.0).
# [[case.opening]]
# ref = "J1"
# kind = "usb_c"
#
# A single-cell LiPo under the board, lying on the tray floor in a pocket fenced by a low rib,
# open toward its lead's connector. bottom_gap must hold thickness + swell + min_clearance.
# [case.battery]
# size = [36.0, 17.0, 7.8]  # length, width, thickness from the cell's datasheet, mm
# at = [120.0, 110.0]       # centre, board mm (default: the board's centre)
# rotate = false            # true: length along y
# swell = 0.8               # headroom for swelling (default 10 % of thickness, INFERRED)
# pad = 0.5                 # cell to fence, per side
# lead = "J3"               # the connector its lead plugs into
# [[case.opening]]
# ref = "SW2"
# kind = "button"
