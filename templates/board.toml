# board.toml: the facts the circuit, the firmware and the spec must agree on (D-022, D-023).
# Copy to boards/<name>/board.toml. Checked by the BOARD.TOML gate (sch, check and fw stages);
# the fw stage turns it into firmware/board_pins.h. Unknown keys are errors.

[board]
name = "<name>"        # must equal the circuit's name (Circuit::new)
revision = "0"         # must equal the circuit's revision
module = "U1"          # reference of the ESP32-S3-WROOM-1 module

# One [[pin]] per module pin the circuit uses as a GPIO; the gate fails if the circuit
# uses one that is not listed here.
#   signal: firmware name, upper case (the header defines PIN_<signal>)
#   pin:    the module symbol's pin name: IO0..IO48, TXD0 (GPIO 43), RXD0 (GPIO 44),
#           USB_D- (GPIO 19), USB_D+ (GPIO 20)
#   net:    the circuit net on that pin, as named in circuit.rs
#   dir:    "in", "out" or "io"
[[pin]]
signal = "STATUS_LED"
pin = "IO48"
net = "STATUS"
gpio = 48
dir = "out"
active_low = false     # optional; true adds PIN_<signal>_ACTIVE_LOW to the header
sim = "led"            # optional: the Wokwi part on this pin (button, led, led_r, led_g, led_b, pot)
note = ""              # optional; copied into the header comment

# Where the current comes from: one [[power.source]] per way the board is powered, each with the
# limits that cap it (the budget is the smallest). A battery board has two: "usb" and "battery".
[[power.source]]
name = "usb"           # lower case; loads name it in `from`, requirements in power:usb / sleep:usb
what = "USB-C 5 V, no PD"

[[power.source.limit]]
name = "USB 2.0 default current"
ma = 500
source = "USB 2.0; that every port gives at least this is INFERRED"

# A battery board also has (limits: the regulator's rating and the cell's peak current):
# [[power.source]]
# name = "battery"
# what = "single-cell LiPo through the RT9080 LDO"
# sleep_ua = 20        # whole board asleep, µA (the spec's sleep requirement)
#
# [[power.source.limit]]
# name = "RT9080 LDO output"
# ma = 600
# source = "RT9080 datasheet"
#
# [[power.source.limit]]
# name = "cell peak discharge"
# ma = 400
# source = "INFERRED: 1C of a 400 mAh cell"

# Worst-case current of each load, at the input. Say where each number comes from;
# write INFERRED in `source` if it is a guess. `from` lists the sources it draws on
# (default: all of them), e.g. from = ["usb"] for a battery charger.
[[power.load]]
name = "ESP32-S3 module, Wi-Fi transmit peak"
ma = 355
source = "WROOM-1 datasheet, HARDWARE_LESSONS.md"

# What still draws current while the board sleeps, against the sources' sleep_ua (default: every
# source with one). `source` must say INFERRED or VERIFIED.
# [[power.sleep_load]]
# name = "ESP32-S3 deep sleep, RTC GPIO wake"
# ua = 8
# source = "VERIFIED: <datasheet, version, page>"

# One per requirement in spec.md, same IDs. covered_by lists what shows it is met:
#   part:<ref>   a part in the circuit
#   pin:<signal> a signal in the pin map above
#   test:<name>  a firmware self-test below
#   gate:<name>  erc, drc, netlist, netclasses, routing or board_toml
#   power:<src>  that power source's current budget holds
#   sleep:<src>  that source's sleep budget holds (the review page shows the total next to it)
[[requirement]]
id = "R1"
text = "Shows that it is running with a status light"
covered_by = ["part:D2", "pin:STATUS_LED", "test:status_led"]

# How the requirement was proven before the order, for the readiness page (the `review` stage
# writes review/readiness.html; docs/workflow.md "Right the first time"). Any number per
# requirement; they belong to the [[requirement]] above them.
#   how:      simulated | datasheet | devboard | gate | unprovable
#   evidence: the scenario, datasheet table, measurement or gate that shows it, in plain words;
#             for unprovable: why, and what covers it at bring-up. "scenario:<name>" (how =
#             "simulated") links a [[sim.scenario]] (or sim/run.py) result: red if it fails
# A requirement with no proof is red on the page and blocks freeze (not a gate failure); one
# with only `unprovable` proofs is amber.
# [[requirement.proof]]
# how = "simulated"
# evidence = "Wokwi run: STATUS_LED goes high after boot (sim.json, status_led)"
#
# [[requirement.proof]]
# how = "unprovable"
# evidence = "How bright it looks through the case; looked at on the first board (devctl selftest)"

# One [[risk]] per guess or unchecked fact the design still rests on (every UNVERIFIED or
# INFERRED item). The readiness page groups them by `fix`, most expensive first.
#   what:     the open item, plain words
#   tag:      "UNVERIFIED" | "INFERRED"
#   fix:      what fixing a miss would need: firmware | rework | new_board
#   miss:     what a miss would cost the owner, plain words
#   check:    optional: how and when it gets settled
#   accepted: optional: the owner's own words accepting it by name
# fix = "new_board" without `accepted` is red and blocks freeze (scripts/freeze.sh reads
# review/readiness.json); with `accepted`, or fix = "rework", it is amber.
# [[risk]]
# what = "The status LED's resistor gives a visible but not glaring light"
# tag = "INFERRED"
# fix = "rework"
# miss = "A light that is too dim or too bright; one resistor swapped by hand"
# check = "Looked at on the first board"
#
# [[risk]]
# what = "The microphone's pinout matches the footprint"
# tag = "UNVERIFIED"
# fix = "new_board"
# miss = "No sound at all; a second order and shipment"
# check = "Independent datasheet check before freeze"
# accepted = "I accept the microphone pinout risk"

[firmware]
# Self-tests the firmware runs at bring-up and reports over USB; each must cover a requirement.
self_test = ["status_led"]

# Wokwi pin checks (`sim --wokwi`; optional). Each step waits for a console line, then presses
# a button signal (hold_ms, default 200; 1000+ is a hold) or checks a signal is at `level`.
# The run then waits for SELFTEST_DONE. Print a report only after a button is released.
[[sim.wokwi_step]]
wait = "SELFTEST_LOOK status_led on"
expect = "STATUS_LED"
level = 1

# QEMU scenarios (the `sim` stage, after its boot check; QEMU is free and unlimited, but has no
# pins: the firmware's `SIM` console commands stand in for them, firmware/components/simcmd).
# Each scenario boots a fresh copy of the QEMU image; its log is in
# firmware/build-qemu/scenarios/<name>.log, its result in firmware/sim.json and on the review
# page. A QEMU crash (the simulator's, not the firmware's) reruns it, up to 3 times, counted.
#   name:      [a-z0-9_]+; a [[requirement.proof]] with evidence = "scenario:<name>" (how =
#              "simulated") is green while it passes and red while it fails or has no result
#   about:     what it shows, plain words
#   nic:       optional, true: QEMU's Ethernet (the Wi-Fi stand-in, CONFIG_ETH_USE_OPENETH)
#   provision: optional NVS values set after boot (PROV SET). Literal test values only, never a
#              secret or a file:/prompt reference: they are in the repo
# Steps, in order, one verb each:
#   send = "<line>"              a console line
#   sim = "<VERB> [arg]"         sends `SIM <VERB> [arg]`, waits 10 s for `SIM OK <VERB> [arg]`
#                                (BUTTON 0|1, PRESS <ms>, or the board's own verbs)
#   wait = "<regex>"             the next line it finds (after the last one matched)
#   expect_json = "<TAG>"        the next `<TAG> {json}` line whose `fields = { k = v }` all match
#   timeout_ms = <ms>            with wait or expect_json: how long (30000 if not given)
#   sleep_ms = <ms>              let the firmware run
#   reboot = true                kill QEMU and boot the same image again (a power cycle)
# A wait that times out sends STATUS first, so the log shows what the firmware says of itself.
# A board that needs more (a mock server, several builds) adds firmware/sim/run.py: the stage
# runs it too and reads its build-qemu/scenarios.json.
# [[sim.scenario]]
# name = "press"
# about = "A short press of the button is seen"
#
# [[sim.scenario.step]]
# wait = "^PROV READY"
# timeout_ms = 60000
#
# [[sim.scenario.step]]
# sim = "PRESS 300"
#
# [[sim.scenario.step]]
# expect_json = "BUTTON"
# fields = { kind = "short" }

# Values `devctl provision` writes into the board's NVS (optional). Only references go here,
# never values: "file:<path>#<field>" (a key=value line in that file) or "prompt".
# Keys: [a-z0-9_], at most 15 characters. A secret that expires takes a table with its expiry
# date; the review page warns 60 days before it.
# [provision]
# wifi_ssid = "prompt"
# gemini_api_key = "file:~/.config/capture-notes/config#gemini_api_key"
# github_token = { from = "file:~/.config/capture-notes/config#github_token", expires = "2027-09-18" }

# The printed case (optional; the `case` stage, D-025 Phase B). Two parts: a tray under the board
# and a lid, closed by self-tapping screws from below through the board's mounting holes.
# Minimums come from the material (JLC3DP): resin walls >= 1.2, holes >= 1.0; nylon 1.5 and 1.5.
# [case]
# material = "resin"      # resin (JLC3DP 9600 white) | nylon (MJF PA12)
# wall = 1.5              # side wall, mm
# floor = 1.5             # tray floor and lid plate
# edge_gap = 0.3          # PCB edge to the inner wall
# top_gap = 1.0           # tallest part to the lid's underside
# bottom_gap = 3.0        # PCB underside to the floor (standoff height)
# min_clearance = 0.2     # fit gate: case to every part
# screw = "M2"            # M2 | M2.5 | M3; the gate picks a length that engages 2 x d in the lid
#
# One per part the case must let through. kind: usb_c | connector | button | pinhole | led | vent.
# Optional: usb_c/connector margin (0.3) and height (usb_c 3.26; a connector must give its
# datasheet height); button diameter (cap, 4.0) and travel (0.25); pinhole diameter (1.4);
# led style ("window" | "hole") and diameter; vent slots (3), slot_width (1.2), slot_length (5.0).
# [[case.opening]]
# ref = "J1"
# kind = "usb_c"
#
# A pinhole can instead go through the tray's floor, for a part whose port is a hole through the
# PCB (a bottom-port microphone): side = "bottom" ("top", the lid, is the default; pinhole only).
# The part's footprint must have exactly one unplated hole; the opening goes under it, inside a
# chimney from the floor up to the PCB's underside, with a groove to the nearest side so the hole
# stays open when the case lies on a table. Fit checks: opening.<ref> (on the PCB hole's axis,
# under the part) and seal.<ref> (the chimney reaches the PCB).
# [[case.opening]]
# ref = "MK1"
# kind = "pinhole"
# side = "bottom"
# diameter = 1.4
#
# A single-cell LiPo under the board, lying on the tray floor in a pocket fenced by a low rib,
# open toward its lead's connector. bottom_gap must hold thickness + swell + min_clearance.
# [case.battery]
# size = [36.0, 17.0, 7.8]  # length, width, thickness from the cell's datasheet, mm
# at = [120.0, 110.0]       # centre, board mm (default: the board's centre)
# rotate = false            # true: length along y
# swell = 0.8               # headroom for swelling (default 10 % of thickness, INFERRED)
# pad = 0.5                 # cell to fence, per side
# lead = "J3"               # the connector its lead plugs into
# [[case.opening]]
# ref = "SW2"
# kind = "button"
