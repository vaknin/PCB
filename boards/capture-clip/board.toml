# board.toml for the capture clip, revision A (template: templates/board.toml).
# Pin choices and why: the header comment of src/circuit.rs and
# research/2026-09-29-esp32-firmware.md §1. Every signal pin is an RTC GPIO, so the firmware
# can hold its level through deep sleep.

[board]
name = "capture-clip"
revision = "A"
module = "U1"

[[pin]]
signal = "BUTTON"
pin = "IO0"
net = "BUTTON_N"
gpio = 0
dir = "in"
active_low = true
sim = "button"
note = "main button SW1 to GND, 10k pull-up (R8); deep-sleep wake (ext1, any low); strapping pin: held low at a full reset = download mode"

[[pin]]
signal = "BAT_ADC"
pin = "IO1"
net = "BAT_ADC"
gpio = 1
dir = "in"
sim = "pot"
note = "cell voltage / 3 (R13 + R14 over R15, 100n C9); ADC1_CH0 at 6 dB; read at rest, averaged"

[[pin]]
signal = "VBUS_SENSE"
pin = "IO2"
net = "VBUS_SENSE"
gpio = 2
dir = "in"
note = "USB 5 V x 0.6 (R16 100k over R17 150k): high = USB present; deep-sleep wake (ext0, high)"

[[pin]]
signal = "CHRG"
pin = "IO4"
net = "CHRG_SENSE"
gpio = 4
dir = "in"
active_low = true
note = "TP4057 CHRG (open drain, low while charging) through 100k (R5); never an internal pull-up (a low would read as ~2.4 V); the charge light pulls it high"

[[pin]]
signal = "STDBY"
pin = "IO5"
net = "STDBY_N"
gpio = 5
dir = "in"
active_low = true
note = "TP4057 STDBY (open drain, low when the charge is complete); internal pull-up only while VBUS_SENSE is high, off before sleep"

[[pin]]
signal = "MIC_PWR"
pin = "IO6"
net = "MIC_PWR"
gpio = 6
dir = "out"
note = "the microphone's VDD through R18 (0 ohm), about 0.5 mA; high = on; stop and ground SCK/WS before switching it off; held low in sleep"

[[pin]]
signal = "CHG_FAST"
pin = "IO7"
net = "CHG_FAST_N"
gpio = 7
dir = "out"
active_low = true
note = "fast charge: open drain; low = R19 (4.3k) in parallel with R3 on the TP4057's PROG = ~333 mA; released (hi-Z) = 100 mA. Never driven high, no pulls. Released whenever Wi-Fi is on, asleep and at reset"

[[pin]]
signal = "LED_R"
pin = "IO8"
net = "LED_R_N"
gpio = 8
dir = "out"
active_low = true
sim = "led_r"
note = "red cathode of D4 through 1k (R10); anode on VSYS; low = on; held high in sleep"

[[pin]]
signal = "LED_G"
pin = "IO9"
net = "LED_G_N"
gpio = 9
dir = "out"
active_low = true
sim = "led_g"
note = "green cathode of D4 through 1k (R11); low = on; held high in sleep"

[[pin]]
signal = "LED_B"
pin = "IO10"
net = "LED_B_N"
gpio = 10
dir = "out"
active_low = true
sim = "led_b"
note = "blue cathode of D4 through 1k (R12); low = on; held high in sleep"

[[pin]]
signal = "I2S_SCK"
pin = "IO11"
net = "I2S_SCK"
gpio = 11
dir = "out"
note = "microphone bit clock (1.024 MHz at 16 kHz); held low in sleep"

[[pin]]
signal = "I2S_WS"
pin = "IO12"
net = "I2S_WS"
gpio = 12
dir = "out"
note = "microphone word select; the mic is the left channel (LR to GND); held low in sleep"

[[pin]]
signal = "I2S_SD"
pin = "IO13"
net = "I2S_SD"
gpio = 13
dir = "in"
note = "microphone data; 100k pull-down (R9)"

[[pin]]
signal = "SPARE_IO21"
pin = "IO21"
net = "SPARE_IO21"
gpio = 21
dir = "io"
note = "spare, on test point TP8 (rework)"

[[pin]]
signal = "UART_TX"
pin = "TXD0"
net = "UART_TX"
gpio = 43
dir = "out"
note = "test point TP6; boot log"

[[pin]]
signal = "UART_RX"
pin = "RXD0"
net = "UART_RX"
gpio = 44
dir = "in"
note = "test point TP7"

[[pin]]
signal = "USB_DM"
pin = "USB_D-"
net = "USB_D-"
gpio = 19
dir = "io"
note = "native USB (flashing, serial console, provisioning)"

[[pin]]
signal = "USB_DP"
pin = "USB_D+"
net = "USB_D+"
gpio = 20
dir = "io"
note = "native USB (flashing, serial console, provisioning)"

# --- Power ------------------------------------------------------------------------------
# On USB the board runs and charges at once, and both currents come out of the port (the
# power path has no input-current limit). That is why the charger's default is 100 mA (R3):
# 355 + 300 would be over a USB 2.0 port's 500 mA.
# Fast charge (CHG_FAST low, ~333 mA) is a firmware state that never overlaps Wi-Fi: the
# firmware releases CHG_FAST before it turns the radio on. [power] adds every load, it can't
# say "these two exclude each other", so the usb budget below is the Wi-Fi case (355 + 100 mA
# + the small loads = the larger sum). The other case is 333 mA + the chip without its radio
# (INFERRED ~100 mA at most, CPU and lights on) = ~435 mA, which is smaller. The rule itself
# is the firmware's (self-test "battery" / the clip's power module), not something a gate checks.

[[power.source]]
name = "usb"
what = "USB-C 5 V (5.1k CC pull-downs: default USB power, no PD); runs the board and charges the cell"

[[power.source.limit]]
name = "USB 2.0 default current"
ma = 500
source = "USB 2.0; that every port and charger gives at least this is INFERRED"

[[power.source.limit]]
name = "HE9073 LDO output"
ma = 500
source = "HE9073 datasheet p.5: 500 mA typical at 0.5 V dropout; limit 550 mA typical, no minimum given (research/2026-09-30-power-path-fix.md)"

[[power.source]]
name = "battery"
what = "single-cell protected LiPo (JST PH) through the AO3401A power path and the HE9073 LDO"
sleep_ua = 20

[[power.source.limit]]
name = "HE9073 LDO output"
ma = 500
source = "HE9073 datasheet p.5: 500 mA typical at 0.5 V dropout; limit 550 mA typical, no minimum given (research/2026-09-30-power-path-fix.md)"

[[power.source.limit]]
name = "cell peak discharge"
ma = 400
source = "INFERRED: 1C of the 400 mAh cell (Adafruit #3898); its datasheet was not read"

[[power.load]]
name = "ESP32-S3 module, Wi-Fi transmit peak"
ma = 355
source = "WROOM-1 datasheet v1.8 (HARDWARE_LESSONS.md)"

[[power.load]]
name = "Battery charger TP4057 while Wi-Fi may be on (R3 10k alone; fast charge ~333 mA only with the radio off)"
ma = 100
from = ["usb"]
source = "TP4057 datasheet p.7 table: 10k = 100 mA (research/2026-09-29-parts-capture-clip.md §2); 10k || 4.3k = 3.0k = ~333 mA per research/2026-09-30-datasheet-check-capture-clip.md"

[[power.load]]
name = "Charge light D1 (5 V through 1k)"
ma = 3.5
from = ["usb"]
source = "(5 V - ~1.5 V LED) / 1k; INFERRED from the circuit"

[[power.load]]
name = "Colour light D4, all three colours on (VSYS through 1k each)"
ma = 8
source = "INFERRED: VSYS 4.7 V on USB, (4.7 - 1.8) + 2 x (4.7 - 2.6) V over 1k = 7.1 mA; less on the cell"

[[power.load]]
name = "Microphone ICS-43434, high-performance mode"
ma = 0.55
source = "ICS-43434 datasheet pp.4-5, max (research/2026-09-29-parts-capture-clip.md §1)"

[[power.load]]
name = "Button pull-up R8 while the button is held"
ma = 0.33
source = "3.3 V / 10k, from the circuit"

[[power.load]]
name = "USB sense divider and gate pull-down (R16 + R17, R6)"
ma = 0.55
from = ["usb"]
source = "5.25 V / 250k + 5.25 V / 10k, from the circuit"

[[power.load]]
name = "LDO's own current and the battery divider"
ma = 0.01
source = "HE9073 Iq 0.7 µA max (datasheet p.5) + 4.2 V / 3 M; rounded up"

# Asleep on the cell. Maximum figures where the datasheet gives one, typical where it doesn't.
[[power.sleep_load]]
name = "ESP32-S3 module in deep sleep, RTC peripherals on (button and USB wake)"
ua = 8
source = "VERIFIED typical, no maximum given: ESP32-S3 datasheet v2.2 Table 5-10 p.68, WROOM-1 v1.8 Table 6-7 p.30 (research/2026-09-29-esp32-firmware.md §1)"

[[power.sleep_load]]
name = "HE9073 LDO quiescent current"
ua = 0.7
source = "VERIFIED maximum (0.3 typical): HE9073 datasheet p.5. In dropout: flat in Fig. 2 p.6 (typical, figure only)"

[[power.sleep_load]]
name = "TP4057 charger, battery pin with USB absent"
ua = 2
source = "VERIFIED maximum (1 typical): TP4057 datasheet p.3 (parts research §2)"

[[power.sleep_load]]
name = "Battery divider (3 x 1M)"
ua = 1.4
source = "INFERRED arithmetic: 4.2 V / 3 M"

[[power.sleep_load]]
name = "Schottky D2 reverse leakage into the 10k pull-down"
ua = 0.55
source = "VERIFIED maximum at 40 V, 25 °C: RB168MM-40 datasheet p.1. At 5 V: ~0.008 µA at 25 °C, ~0.9 µA at 75 °C typical (Fig. p.2); ~0.2 typical / ~2.5 worst at 60 °C is INFERRED"

[[power.sleep_load]]
name = "Microphone (VDD off), lights (pins held high), USB sense divider (no USB)"
ua = 0
source = "INFERRED from the circuit: each is switched off or unpowered asleep"

# --- Requirements (same IDs as spec.md) ----------------------------------------------------

[[requirement]]
id = "R1"
text = "Runs from a single-cell LiPo battery and from USB-C, and charges the battery from any USB-C charger or computer port (5 V, no USB-PD)"
covered_by = ["part:J1", "part:R1", "part:R2", "part:J2", "part:U2", "part:Q1", "part:D2", "part:U4", "pin:CHG_FAST", "power:usb", "power:battery"]

[[requirement]]
id = "R2"
text = "Sleeps between uses, so the battery lasts weeks (whole board under 20 µA asleep)"
covered_by = ["sleep:battery", "part:U4", "pin:MIC_PWR"]

[[requirement]]
id = "R3"
text = "One button: a press starts or stops a new recording; a hold of about 1 s starts an addition to this device's last note"
covered_by = ["part:SW1", "pin:BUTTON", "test:button"]

[[requirement]]
id = "R4"
text = "Records speech clearly from about arm's length with an on-board digital microphone"
covered_by = ["part:MK1", "pin:MIC_PWR", "pin:I2S_SCK", "pin:I2S_WS", "pin:I2S_SD", "test:mic"]

[[requirement]]
id = "R5"
text = "Keeps at least 30 minutes of recordings when there is no Wi-Fi (one recording up to 15 minutes), and sends them once connected"
covered_by = ["part:U1", "test:wifi"]

[[requirement]]
id = "R6"
text = "Sends each recording to Gemini and saves the note to the GitHub notes repo in Capture's note format"
covered_by = ["part:U1", "test:wifi"]

[[requirement]]
id = "R7"
text = "Shows its state with one colour light, plus a charge light"
covered_by = ["part:D4", "pin:LED_R", "pin:LED_G", "pin:LED_B", "part:D1", "test:led_rgb"]

[[requirement]]
id = "R8"
text = "Knows its battery level and whether USB is plugged in, and warns when the battery is low"
covered_by = ["pin:BAT_ADC", "pin:VBUS_SENSE", "pin:CHRG", "pin:STDBY", "test:battery", "test:usb_sense"]

[[requirement]]
id = "R9"
text = "Flashed, set up and debugged over the same USB-C cable, without extra hardware; survives static and surges on the USB port"
covered_by = ["pin:USB_DM", "pin:USB_DP", "pin:BUTTON", "part:SW2", "part:U3", "part:D3", "test:usb_sense"]

[[requirement]]
id = "R10"
text = "Built around a pre-certified ESP32-S3 module (Wi-Fi); no antenna design"
covered_by = ["part:U1"]

[[requirement]]
id = "R11"
text = "Fully assembled by JLCPCB with in-stock parts, passing their design rules"
covered_by = ["gate:erc", "gate:drc", "gate:netlist", "gate:netclasses", "gate:routing"]

[firmware]
# The spec's "What done means": the microphone hears sound, each colour works, the button is
# seen, the battery voltage makes sense, USB is detected, Wi-Fi connects.
self_test = ["mic", "led_rgb", "button", "battery", "usb_sense", "wifi"]

# Values `devctl provision` writes into the board's encrypted NVS. References only, never values.
# The key and the token are Capture's own (D-024, the owner's call).
[provision]
wifi_ssid = "prompt"
wifi_pass = "prompt"
notes_repo = "prompt"
gemini_api_key = "file:~/.config/capture-notes/config#gemini_api_key"
github_token = { from = "file:~/.config/capture-notes/config#github_token", expires = "2027-09-18" }

# The printed case (Phase E.4). The cell (Adafruit #3898, 36 x 17 x 7.8 mm) lies on the tray
# floor under the board; bottom_gap holds 7.8 + 0.78 swell + 0.2 clearance = 8.78 mm. Material and
# colour are the owner's choice (a choice page at the first round with a case); resin is only the
# starting value.
[case]
material = "resin"
wall = 1.5
floor = 1.5
edge_gap = 0.3
top_gap = 2.2              # room for the button cap over the 5 mm switch (flange + stem under the lid)
bottom_gap = 9.0
min_clearance = 0.2
screw = "M2"

[case.battery]
size = [36.0, 17.0, 7.8]   # parts research §10 (adafruit.com/product/3898)
at = [115.0, 136.0]        # centre, KiCad page mm (the board's top-left is 100, 100): cell x 6.5..23.5, y 18..54 on the board
rotate = true              # length along the board's long side
lead = "J2"

[[case.opening]]
ref = "J1"            # USB-C
kind = "usb_c"

[[case.opening]]
ref = "SW1"           # main button: a printed cap
kind = "button"

[[case.opening]]
ref = "D4"            # colour light
kind = "led"

[[case.opening]]
ref = "D1"            # charge light
kind = "led"

[[case.opening]]
ref = "MK1"           # microphone: bottom-port, its sound hole goes through the PCB, so the opening is in the tray
kind = "pinhole"
side = "bottom"
diameter = 1.5        # printable in resin (>= 1.0) and nylon (>= 1.5)

[[case.opening]]
ref = "SW2"           # reset: a pinhole for a paper clip
kind = "pinhole"
